name: About
on: workflow_dispatch
permissions:
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH repos/${{ github.repository }} \
            -f description="Remote MCP server that lets Claude, Cursor and other AI assistants check Indian IFSC codes, PIN codes, GSTINs and PANs, and run a full vendor KYC check. Free, no API key." \
            -f homepage="https://indiakyc.vercel.app"
